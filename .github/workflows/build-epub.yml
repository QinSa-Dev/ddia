name: Build EPUB
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream v2
        uses: actions/checkout@v4
        with:
          repository: Vonng/ddia
          ref: v2
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pandoc make

      - name: Install Go
        run: |
          curl -OL https://go.dev/dl/go1.27.2.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.27.2.linux-amd64.tar.gz
          echo "PATH=$PATH:/usr/local/go/bin" >> $GITHUB_ENV

      - name: Go mod download
        run: go mod download

      - name: Build EPUB
        run: make epub

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddia-epub
          path: output/ddia.epub
